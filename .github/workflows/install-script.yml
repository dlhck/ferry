name: Install script

# Runs install.sh against a fake release on disk, on Linux and macOS.

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "test/install-script.test.ts"
      - ".github/workflows/install-script.yml"
  pull_request:
    paths:
      - "install.sh"
      - "test/install-script.test.ts"
      - ".github/workflows/install-script.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test install.sh on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun ci

      # The test runs the script with sh, dash, and bash, when the shell is present.
      # sh is dash on Ubuntu and bash in POSIX mode on macOS.
      - name: Test install.sh
        run: bun test test/install-script.test.ts

      - name: Run shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
