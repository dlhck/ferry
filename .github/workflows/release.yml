name: Release

# The owner creates a draft GitHub release for vX.Y.Z, then pushes the tag. This workflow
# builds the binaries, attaches them to the draft, publishes the npm packages, and publishes
# the release as its last step. Nobody sees a draft, so the release is never visible without
# its files. See RELEASING.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Read version from tag
    # A tag push never comes from a pull request. This condition also stops forks.
    if: github.repository == 'dlhck/ferry'
    runs-on: ubuntu-latest
    # Only a token with write access can read a draft release.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}

    steps:
      - name: Check tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z or vX.Y.Z-<pre-release>."
            exit 1
          fi
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Version $version, npm dist-tag $dist_tag"

      # Stop before the builds when the owner pushed the tag without a release for the notes.
      - name: Check release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            echo "::error::There is no release for $TAG. Create the draft release, then run the failed jobs again. See RELEASING.md."
            exit 1
          fi
          if [ "$draft" != true ]; then
            echo "::warning::The release for $TAG is not a draft. A published release is visible before its files are attached. See RELEASING.md."
          fi

  build:
    name: Build ${{ matrix.asset }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # macOS kills an arm64 executable that has no valid signature. A darwin binary
          # compiled on Linux has a signature that is not valid, so the darwin binaries
          # compile and get an ad-hoc signature on macOS. Each runs on its own architecture.
          - target: bun-darwin-arm64
            asset: ferry-darwin-arm64
            os: macos-latest
          - target: bun-darwin-x64
            asset: ferry-darwin-x64
            os: macos-15-intel
          - target: bun-linux-arm64
            asset: ferry-linux-arm64
            os: ubuntu-latest
          - target: bun-linux-x64
            asset: ferry-linux-x64
            os: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun ci

      - name: Compile executable
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >-
          bun build --compile --target=${{ matrix.target }}
          --define "FERRY_VERSION=\"$VERSION\"" src/cli.ts
          --outfile dist/${{ matrix.asset }}

      - name: Sign executable
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - "dist/${{ matrix.asset }}"
          codesign -v "dist/${{ matrix.asset }}"

      - name: Run executable
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          "dist/${{ matrix.asset }}" --help
          test "$("dist/${{ matrix.asset }}" --version)" = "$VERSION"

      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  menubar:
    name: Build ferry-menubar-macos.zip
    needs: version
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A universal app with an ad-hoc signature. See macos/build.sh.
      - name: Build app
        env:
          FERRY_VERSION: ${{ needs.version.outputs.version }}
        run: macos/build.sh

      - name: Upload app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferry-menubar-macos.zip
          path: dist/ferry-menubar-macos.zip
          if-no-files-found: error

  attach:
    name: Attach binaries to draft release
    needs: [build, menubar]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ferry-*
          path: dist
          merge-multiple: true

      # install.sh and ferry menubar install verify the downloads against this file.
      - name: Write checksums
        working-directory: dist
        run: sha256sum ferry-* > SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber

  # npm cannot take a version back. So this job runs after the files are on the draft release,
  # and only the release job comes after it.
  publish:
    name: Publish to npm
    needs: [version, build, attach]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No registry-url: with it, setup-node writes an .npmrc that reads NODE_AUTH_TOKEN.
      # npm uses the default registry and gets a short-lived token through OIDC.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Download executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ferry-*
          path: dist
          merge-multiple: true

      - name: Stage packages
        run: node npm/stage.mjs "${{ needs.version.outputs.version }}" dist out

      - name: Publish packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DIST_TAG: ${{ needs.version.outputs.dist-tag }}
        run: |
          # Trusted publishing (OIDC) needs npm 11.5.1 or later. There is no token. See RELEASING.md.
          npm_version=$(npm --version)
          echo "npm $npm_version"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version cannot use trusted publishing. It needs npm 11.5.1 or later."
            exit 1
          fi
          on_npm() {
            [ "$(npm view "$1@$VERSION" version 2>/dev/null)" = "$VERSION" ]
          }
          publish() {
            name=$(node -p "require('$1/package.json').name")
            # A second run of a failed release skips the packages that are already on npm.
            if on_npm "$name"; then
              echo "$name@$VERSION is already on npm."
              return
            fi
            npm publish "$1" --provenance --access public --tag "$DIST_TAG"
          }
          # Platform packages first, so the main package never points at a missing version.
          platforms="ferry-darwin-arm64 ferry-darwin-x64 ferry-linux-arm64 ferry-linux-x64"
          for platform in $platforms; do
            publish "./out/$platform"
          done
          # npm shows a new version some time after the publish, and not in the publish order.
          # Wait for the platform packages, at most 15 minutes, then publish the main package.
          for platform in $platforms; do
            tries=0
            until on_npm "@dlhck/$platform"; do
              tries=$((tries + 1))
              if [ "$tries" -gt 60 ]; then
                echo "::error::npm does not show @dlhck/$platform@$VERSION. Run the failed jobs again later."
                exit 1
              fi
              sleep 15
            done
            echo "npm shows @dlhck/$platform@$VERSION."
          done
          publish ./out/ferry

  # The last job. It makes the release visible when the files are attached and npm shows all
  # five packages. The GitHub release comes after npm, because a failed npm publish then
  # leaves a draft, and the clients read the new version from the GitHub release.
  release:
    name: Publish release
    needs: [version, attach, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      DIST_TAG: ${{ needs.version.outputs.dist-tag }}

    steps:
      - name: Wait for npm packages
        run: |
          # At most 15 minutes for each package.
          for name in ferry-darwin-arm64 ferry-darwin-x64 ferry-linux-arm64 ferry-linux-x64 ferry; do
            tries=0
            until [ "$(npm view "@dlhck/$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; do
              tries=$((tries + 1))
              if [ "$tries" -gt 60 ]; then
                echo "::error::npm does not show @dlhck/$name@$VERSION. The release stays a draft. Run the failed jobs again later."
                exit 1
              fi
              sleep 15
            done
            echo "npm shows @dlhck/$name@$VERSION."
          done

      - name: Check release assets
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for name in ferry-darwin-arm64 ferry-darwin-x64 ferry-linux-arm64 ferry-linux-x64 ferry-menubar-macos.zip SHA256SUMS; do
            if ! printf '%s\n' "$assets" | grep -qx "$name"; then
              echo "::error::The release for $TAG does not have $name. The release stays a draft."
              exit 1
            fi
          done

      # A version with a pre-release part is a GitHub pre-release, so it is never the latest release.
      - name: Publish release
        run: |
          if [ "$DIST_TAG" = next ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false
          fi
